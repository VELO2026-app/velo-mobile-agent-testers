# =============================================================================
# VELO Mini App on Android emulators, driven by AI agent testers (FE-276 pilot)
# =============================================================================
#
# One job per cell = persona (a phone from personas.json) x skin (gold, goodo):
#   1. a throwaway VELO stack on the runner, built from VELO2026-app/velo at
#      `velo_ref`: Postgres + Redis as job services, the backend, the comms
#      stub, the app built with the brand skin and served by `vite preview`.
#      It is the same recipe as velo's own e2e-stack job. The bot token is the
#      FAKE `e2e:fake`, so the initData the lane signs is worth nothing outside
#      this runner.
#   2. an Android emulator (KVM) with Chrome, reaching the app through
#      `adb reverse` as http://localhost:4173.
#   3. agent=true: Claude Code drives the phone (briefs/velo-student.md);
#      agent=false: a smoke check with no model and no key (scripts/velo/smoke.py).
#
# No Telegram, no real bot, no real account. Telegram on a device is a separate
# lane: docs/telegram-lane.md.
#
# Results are encrypted with results_public.pem before upload (the logs of a
# public repository are public); collect.sh decrypts them with the private key
# that lives in ~/.mobile-agent-testers/ on the owner's machine.
# =============================================================================
name: VELO Android agent testers

on:
  workflow_dispatch:
    inputs:
      agent:
        description: "true = Claude Code drives the phone (needs a Claude key secret); false = dry run with no model"
        type: boolean
        default: true
      velo_ref:
        description: Branch, tag or full SHA of VELO2026-app/velo to test (acceptance runs use the commit BEFORE a fix)
        default: deploy-machine
      skins:
        description: Skins, space-separated (gold goodo)
        default: "gold goodo"
      personas:
        description: Android personas from personas.json, comma-separated (malik = Pixel 7 API 34 dark, anna = small phone API 30 font 1.3)
        default: "malik"
      brief:
        description: Agent brief
        default: briefs/velo-student.md
      start_path:
        description: Path the app opens first (/ = welcome screen of a fresh student)
        default: "/"
      model:
        description: "sonnet (default), opus, haiku (cheapest) or a full Claude id. With llm_base_url, the provider's model name"
        default: sonnet
      llm_base_url:
        description: "Optional Anthropic-compatible API instead of Claude (key in the LLM_API_KEY secret)"
        default: ""
      record_video:
        description: Record each phone's screen (encrypted with the results)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  plan:
    name: plan and key check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      cells: ${{ steps.cells.outputs.cells }}
    steps:
      - uses: actions/checkout@v7

      # Fails here, in seconds, with the exact command to run, when the agent
      # would start without a Claude key.
      - name: Check the key
        env:
          AGENT: ${{ inputs.agent }}
          LLM_BASE_URL: ${{ inputs.llm_base_url }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        run: bash scripts/velo/preflight.sh

      - id: cells
        env:
          PERSONAS: ${{ inputs.personas }}
          SKINS: ${{ inputs.skins }}
        run: |
          rows=$(PERSONAS="$PERSONAS" PLATFORM=android python3 scripts/matrix.py | sed 's/^android=//')
          cells=$(jq -cn --argjson rows "$rows" --arg skins "${SKINS//,/ }" '
            [ $rows[] as $r
              | ($skins | split(" ") | map(select(length > 0)))[] as $skin
              | $r + { skin: $skin,
                       brand: (if $skin == "gold" then "velo-brand"
                               elif $skin == "goodo" then "goodo-brand"
                               else error("unknown skin: \($skin) (gold or goodo)") end) } ]')
          [ "$cells" != "[]" ] || { echo "::error::no cells: check personas and skins"; exit 1; }
          echo "cells=$cells" >> "$GITHUB_OUTPUT"
          echo "$cells" | jq -r '.[] | "- \(.persona) / \(.skin): \(.device)"' >> "$GITHUB_STEP_SUMMARY"

  android:
    name: ${{ matrix.persona }} / ${{ matrix.skin }}
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.cells) }}
    services:
      postgres:
        image: postgres:16.15-trixie@sha256:ca0bd484cb98bf4b24eb1010e73fb3fcbd6714d240fbc1a10eea5b7dbecb641d
        env:
          POSTGRES_USER: velo
          POSTGRES_PASSWORD: velo
          POSTGRES_DB: velo
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U velo" --health-interval 2s --health-timeout 5s --health-retries 30
      redis:
        image: redis:7.4.11-alpine3.21@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      DATABASE_URL: postgresql+asyncpg://velo:velo@127.0.0.1:5432/velo
      REDIS_URL: redis://127.0.0.1:6379/0
      # FAKE on purpose: the backend checks initData with this same token and
      # scripts/velo/sign_init_data.py signs with it. Not a secret.
      TELEGRAM_BOT_TOKEN: 'e2e:fake'
      STORAGE_ENDPOINT: http://127.0.0.1:9000
      STORAGE_SECRET_KEY: e2e-no-storage
      PRIMER_RELEASE: ci
      PRIMER_COMMIT: ${{ github.sha }}
      TELEGRAM_BOT_URL: https://t.me/velo_e2e_bot
      COMMS_API_URL: http://127.0.0.1:8899
      COMMS_SERVICE_TOKEN: e2e-comms
      COMMS_RELAY_ENABLED: 'false'
      ZOOM_RETRY_ENABLED: 'false'
      ZOOM_REPORT_ENABLED: 'false'
      E2E_LOG_DIR: ${{ github.workspace }}/stack-logs
    steps:
      - uses: actions/checkout@v7

      - uses: actions/checkout@v7
        with:
          repository: VELO2026-app/velo
          ref: ${{ inputs.velo_ref }}
          path: velo
          persist-credentials: false

      - name: Which velo commit is under test
        run: |
          echo "velo: $(git -C velo rev-parse HEAD) ($(git -C velo log -1 --format=%s | cut -c1-80))" | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: velo/backend/requirements.txt

      - name: Install the backend (velo/backend/requirements.txt)
        working-directory: velo/backend
        run: 'pip install --no-cache-dir --require-hashes --only-binary :all: -r requirements.txt'

      # velo/backend/ci.env is the one settings environment of velo's CI; the
      # job's fake TELEGRAM_BOT_TOKEN wins over the one in it.
      - name: Bring up the stack (migrate, seed, comms stub, uvicorn)
        run: |
          token=$TELEGRAM_BOT_TOKEN
          set -a; . velo/backend/ci.env; set +a
          export TELEGRAM_BOT_TOKEN="$token"
          sh velo/frontend/e2e/stack/up.sh

      - uses: pnpm/action-setup@v5
        with:
          version: 12.4.2

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: velo/pnpm-lock.yaml

      - name: Install the frontend (frozen lockfile)
        working-directory: velo
        run: pnpm install --frozen-lockfile

      - name: Fetch the brand skin packages (pinned tags of velo/.github/brand-skins.json)
        working-directory: velo
        run: node .github/scripts/fetch-brand-skins.mjs "$RUNNER_TEMP/brands" > /dev/null

      - name: Build the app (${{ matrix.skin }} skin = ${{ matrix.brand }})
        working-directory: velo
        run: |
          node frontend/scripts/apply-skin.mjs "$RUNNER_TEMP/brands/${{ matrix.brand }}/skin"
          pnpm -C frontend exec vite build

      - name: Serve the build (vite preview, /api goes to the backend on :8000)
        working-directory: velo/frontend
        run: |
          nohup pnpm exec vite preview --outDir dist --host 127.0.0.1 --port 4173 --strictPort \
            > "$E2E_LOG_DIR/preview.log" 2>&1 &
          for i in $(seq 1 60); do curl -sf -o /dev/null http://127.0.0.1:4173/ && break; sleep 1; done
          curl -sf -o /dev/null http://127.0.0.1:4173/ || { tail -n 30 "$E2E_LOG_DIR/preview.log"; exit 1; }
          echo "app is up on :4173"

      - name: Tools (Pillow, websocket-client; Claude Code when the agent runs)
        env:
          AGENT: ${{ inputs.agent }}
        run: |
          pip install -q pillow websocket-client
          if [ "$AGENT" = true ]; then npm install -g --silent @anthropic-ai/claude-code; fi

      - name: Device profile (fallback to pixel_6)
        id: profile
        env: { WANTED: "${{ matrix.profile }}" }
        run: |
          if "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" list device -c 2>/dev/null | grep -qx "$WANTED"; then echo "profile=$WANTED" >> "$GITHUB_OUTPUT"
          else echo "profile=pixel_6" >> "$GITHUB_OUTPUT"; echo "Profile $WANTED missing, pixel_6 used" >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm

      - name: Emulator + ${{ inputs.agent && 'agent' || 'smoke check' }}
        uses: reactivecircus/android-emulator-runner@v2
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ inputs.agent && secrets.CLAUDE_CODE_OAUTH_TOKEN || '' }}
          ANTHROPIC_API_KEY: ${{ inputs.agent && secrets.ANTHROPIC_API_KEY || '' }}
          LLM_API_KEY: ${{ inputs.agent && secrets.LLM_API_KEY || '' }}
          LLM_BASE_URL: ${{ inputs.llm_base_url }}
          AGENT: ${{ inputs.agent }}
          PERSONA: ${{ matrix.persona }}
          SKIN: ${{ matrix.skin }}
          DEVICE: ${{ matrix.device }}
          FONT_SCALE: ${{ matrix.font_scale }}
          THEME: ${{ matrix.theme }}
          LOCALE: ${{ matrix.locale }}
          GEO: ${{ matrix.geo }}
          BRIEF: ${{ inputs.brief }}
          START_PATH: ${{ inputs.start_path }}
          MODEL: ${{ inputs.model }}
          RECORD_VIDEO: ${{ inputs.record_video }}
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: ${{ steps.profile.outputs.profile }}
          ram-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash scripts/velo/run_android.sh

      - name: Encrypt results
        if: always()
        run: bash scripts/encrypt_results.sh "${{ matrix.persona }}-${{ matrix.skin }}"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: results-${{ matrix.persona }}-${{ matrix.skin }}
          path: results.enc/
          retention-days: 14

      # The stack is synthetic (fake token, seeded fake people), so its logs are
      # safe to keep in the open when something fails.
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: stack-logs-${{ matrix.persona }}-${{ matrix.skin }}
          path: stack-logs
          retention-days: 7
